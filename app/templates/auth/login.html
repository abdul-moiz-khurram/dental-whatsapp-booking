<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="dash">
<div class="login-shell">
  <div class="login-card">
    <a href="{{ url_for('landing') }}" class="brand" style="display:flex;"><span class="brand-mark"></span>Recall</a>
    <p class="sub">Sign in to your clinic dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <div style="text-align:right;"><a href="{{ url_for('auth.forgot_password') }}" style="font-size:12.5px; color:var(--ink-soft); text-decoration:none;">Forgot password?</a></div>
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <p class="sub" style="margin-top:20px; margin-bottom:0;">New clinic? <a href="{{ url_for('auth.signup') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">Create an account →</a></p>
  </div>
</div>
</body>
</html>
