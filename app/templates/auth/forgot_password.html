<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="dash">
<div class="login-shell">
  <div class="login-card">
    <a href="{{ url_for('landing') }}" class="brand" style="display:flex;"><span class="brand-mark"></span>Recall</a>
    <p class="sub">Enter the email on your account and we'll send a reset link</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>

    <p class="sub" style="margin-top:20px; margin-bottom:0;"><a href="{{ url_for('auth.login') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">← Back to sign in</a></p>
  </div>
</div>
</body>
</html>
